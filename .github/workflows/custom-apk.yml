name: Build Custom RustDesk APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'master'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c # Versão estável para RustDesk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Injetar Configurações
        run: |
          CONF="flutter/lib/common.dart"
          sed -i "s|const RENDEZVOUS_SERVER = .*|const RENDEZVOUS_SERVER = '${{ secrets.MY_ID_SERVER }}';|" $CONF
          sed -i "s|const RELAY_SERVER = .*|const RELAY_SERVER = '${{ secrets.MY_RELAY_SERVER }}';|" $CONF
          sed -i "s|const RS_PUB_KEY = .*|const RS_PUB_KEY = '${{ secrets.MY_PUB_KEY }}';|" $CONF
          sed -i "s|bool checkUpdate = .*|bool checkUpdate = false;|" $CONF
          sed -i "s|bool stopUpgrade = .*|bool stopUpgrade = true;|" $CONF

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib cli-common libasound2-dev libpulse-dev \
            libdbus-1-dev libcommon-sense-perl libglib2.0-dev libvpx-dev \
            libx11-dev libxdotool-dev libxtst-dev libxcb-composite0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build APK ARM64
        run: |
          # Define variáveis críticas para o compilador Rust/Dart
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          
          # Entra na pasta e limpa antes de buildar
          cd flutter
          flutter pub get
          
          # O RustDesk precisa gerar as pontes (bridges) de comunicação
          # Se o comando falhar, tente: flutter build apk --release --target-platform android-arm64
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-1.4.7-Custom
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
