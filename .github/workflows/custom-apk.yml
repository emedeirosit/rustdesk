name: Build Custom RustDesk APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'master'
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          targets: aarch64-linux-android

      - name: Setup Rust Android Environment
        run: |
          # Configura o cargo para usar o linker correto do NDK Android
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          ar = "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ar"
          linker = "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          EOF

      - name: Setup vcpkg e Dependências Nativa
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib cmake python3-pip ninja-build
          cargo install cargo-ndk --version 3.5.4 --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Injetar Configurações
        run: |
          CONF="flutter/lib/common.dart"
          sed -i "s|const RENDEZVOUS_SERVER = .*|const RENDEZVOUS_SERVER = '${{ secrets.MY_ID_SERVER }}';|" $CONF
          sed -i "s|const RELAY_SERVER = .*|const RELAY_SERVER = '${{ secrets.MY_RELAY_SERVER }}';|" $CONF
          sed -i "s|const RS_PUB_KEY = .*|const RS_PUB_KEY = '${{ secrets.MY_PUB_KEY }}';|" $CONF
          sed -i "s|bool checkUpdate = .*|bool checkUpdate = false;|" $CONF
          sed -i "s|bool stopUpgrade = .*|bool stopUpgrade = true;|" $CONF

      - name: Build APK ARM64
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export VCPKG_ROOT=$VCPKG_ROOT
          export PATH=$PATH:$HOME/.cargo/bin
          
          cd flutter
          flutter pub get
          find . -name "gradlew" -exec chmod +x {} +
          
          # Build focando apenas em ARM64
          flutter build apk --release --target-platform android-arm64 --verbose

      - name: Upload APK Customizado
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Final-Installer
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
